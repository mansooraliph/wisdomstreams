# Reverse proxy for streams.peaceradio.com — WisdomStream, path-routed:
#   /            -> web app        (port 4002)
#   /studio      -> studio app     (port 4003)
#   /admin       -> admin app      (port 4004)
#   /api         -> API            (port 4001)
#   /media       -> MinIO          (port 9000, avatars/banners/thumbnails)
# certbot --nginx will add the TLS server block and http->https redirect on
# top of this file; this is the initial HTTP-only version.
server {
    listen 80;
    listen [::]:80;
    server_name streams.peaceradio.com;

    client_max_body_size 100m;

    location /api {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
    }

    location /studio {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:4004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
